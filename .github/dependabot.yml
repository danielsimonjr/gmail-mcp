version: 2
updates:
  # `npm`, NOT `bun` — Dependabot's bun parser supports only lockfileVersion 1,
  # and Bun 1.4 writes 2, so the bun ecosystem fails with
  #   Unsupported bun.lock 'lockfileVersion' 2 in /bun.lock.
  # Security alerts stay dependency-graph based; only automated remediation dies.
  # bun.lock stays authoritative and is regenerated by `bun install`.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    labels: [dependencies, npm]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels: [dependencies, github-actions]
