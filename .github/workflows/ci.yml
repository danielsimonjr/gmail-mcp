# TypeScript-on-Bun toolchain: bun install, bun test, tsc.
# Shipped MCP plugin bundles still launch under Node (Claude Code `command: node`),
# so the Node runtime remains what protocol tests spawn (`node dist/index.js`).

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the PRODUCTION platform for this MCP server (Daniel runs it
        # locally on Windows), but CI was Linux-only — i.e. it never tested the OS
        # the server actually ships on.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node = MCP runtime under test (protocol suite spawns `node dist/index.js`).
      # Bun = package manager + script driver only (not the long-lived server runtime).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile
      # --if-present must precede the script name (bun passes a trailing flag through).
      - run: bun run --if-present typecheck
      - run: bun run --if-present lint
      - run: bun run --if-present build
      - run: bun run --if-present test
